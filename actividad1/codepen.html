<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica 2 - Actividad 1</title>
  <!-- El editor nuevo de CodePen no enlaza automáticamente los archivos. -->
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
  }
}
  </script>
  <script type="module" src="./script.js"></script>
</head>
<body>

<main>
  <h1>Práctica 2 - Actividad 1</h1>
  <p>Transformaciones afines: traslación, rotación y escalamiento de un objeto 3D.</p>

  <div class="layout">
    <aside>
      <h2>Controles</h2>

      <section class="control-group">
        <h3>Traslación</h3>
        <div id="translation-controls" class="slider-list"></div>
      </section>

      <section class="control-group">
        <h3>Rotación (grados)</h3>
        <div id="rotation-controls" class="slider-list"></div>
      </section>

      <section class="control-group">
        <h3>Escalamiento</h3>
        <div id="scale-controls" class="slider-list"></div>
      </section>

      <button id="reset-button" type="button">Restablecer</button>

      <div class="options">
        <label><input id="show-axes" type="checkbox" checked> Mostrar ejes</label>
        <label><input id="show-wireframe" type="checkbox"> Mostrar malla</label>
      </div>
    </aside>

    <section class="viewer" aria-label="Visualización 3D">
      <div class="viewer-heading">
        <h2>Resultado</h2>
        <span id="load-status" role="status">Cargando modelo...</span>
      </div>
      <div id="viewport"></div>
      <p class="hint">Arrastra para girar la cámara. Usa la rueda para acercar o alejar.</p>
    </section>
  </div>
</main>
</body>
</html>
